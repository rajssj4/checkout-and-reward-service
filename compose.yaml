services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkout -d checkout']
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
