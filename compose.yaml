x-app-environment: &app-environment
  NODE_ENV: production
  PORT: '3000'
  # Local Compose credentials only. This hostname resolves inside the Compose network.
  DATABASE_URL: postgresql://checkout:checkout@postgres:5432/checkout
  REWARD_EVERY_N_ORDERS: ${REWARD_EVERY_N_ORDERS:-5}
  DISCOUNT_BPS: ${DISCOUNT_BPS:-1000}
  CURRENCY: ${CURRENCY:-USD}
  DB_POOL_MAX: ${DB_POOL_MAX:-10}

x-app-image: &app-image
  image: checkout-and-reward-service:local
  build:
    context: .
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/001-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkout -d checkout']
      interval: 2s
      timeout: 3s
      retries: 15

  db-init:
    <<: *app-image
    environment: *app-environment
    command:
      ['sh', '-c', 'node dist/db/cli.js migrate && node dist/db/cli.js seed']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      disable: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]

  app:
    <<: *app-image
    environment: *app-environment
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - '${API_BIND_HOST:-127.0.0.1}:${PORT:-3000}:3000'
    read_only: true
    tmpfs: [/tmp]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    stop_grace_period: 15s

volumes:
  postgres-data:
