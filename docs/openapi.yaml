openapi: 3.0.3
info:
  title: Checkout and Rewards Service
  version: 0.4.0
  description: >-
    Product, cart, checkout, and order APIs. Amounts are USD minor units represented as safe JSON integers.
    Cart totals use current product prices and are estimates. Carts do not reserve inventory.
    Includes single-use milestone coupons and read-only administrative reporting.
servers:
  - url: /
tags:
  - name: Health
  - name: Products
  - name: Carts
  - name: Orders
  - name: Administration
    description: Administrative operations. Authentication and authorization are not implemented.
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service liveness
      responses:
        '200':
          description: HTTP service is running; not a continuous database readiness check.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products with current price and inventory
      responses:
        '200':
          description: Products sorted by ID.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts:
    post:
      tags: [Carts]
      operationId: createCart
      summary: Create an empty cart
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '201':
          description: Empty OPEN cart created.
          headers:
            Location:
              schema:
                type: string
              example: /carts/7f9aad66-343a-4b93-bc63-1b1aa8a8aa42
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts/{cartId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
    get:
      tags: [Carts]
      operationId: getCart
      summary: View cart with current prices and availability
      description: >-
        Uses a consistent database snapshot. isAvailable is false when current stock is
        below the requested quantity. No inventory is reserved. Completed carts remain
        readable; these are current estimates, not historical order totals.
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts/{cartId}/items/{productId}:
    parameters:
      - $ref: '#/components/parameters/CartId'
      - $ref: '#/components/parameters/ProductId'
    put:
      tags: [Carts]
      operationId: setCartItem
      summary: Add an item or replace its quantity
      description: >-
        Quantity is absolute, not incremental. Repeating the same request does not add
        more units. Stock is checked during the edit but is not reserved. Unknown fields
        are rejected. Use DELETE to remove an item; zero is not valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 1000000
            example:
              quantity: 2
      responses:
        '200':
          $ref: '#/components/responses/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Carts]
      operationId: removeCartItem
      summary: Remove an item from an open cart
      description: Repeated removal of an absent item, including an unknown product ID, returns 204 on an open cart.
      responses:
        '204':
          description: Item removed or already absent. No response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
  /carts/{cartId}/checkout:
    parameters:
      - $ref: '#/components/parameters/CartId'
    post:
      tags: [Orders]
      operationId: checkoutCart
      summary: Place an order atomically
      description: >-
        Uses current prices and rechecks stock. Success creates one immutable order,
        decrements inventory, and closes the cart in one transaction. Commit is payment
        success; no external payment call occurs. Idempotency keys are global and durable.
        Same key and normalized inputs replay the original order; changed cart/coupon inputs
        conflict. Failed attempts are not cached. Retry a timeout or 503 using the same key.
        One case-sensitive bearer coupon may be redeemed once; failure never consumes it.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique client-generated key, 1–128 printable ASCII characters without spaces.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]{1,128}$'
          example: checkout-attempt-001
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                couponCode:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: Trimmed, case-sensitive bearer code; empty/null is invalid. One coupon per order.
            example: {}
      responses:
        '201':
          description: Order committed successfully.
          headers:
            Location:
              schema:
                type: string
              description: URL of the created order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '200':
          description: Original order replayed for the same successful idempotency key and input.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: EMPTY_CART, INSUFFICIENT_INVENTORY, COUPON_INVALID, COUPON_ALREADY_REDEEMED, IDEMPOTENCY_KEY_REUSED, or CART_ALREADY_CHECKED_OUT (includes existing orderId).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                completedCart:
                  value:
                    error:
                      code: CART_ALREADY_CHECKED_OUT
                      message: Cart is already checked out.
                      details:
                        orderId: 7f9aad66-343a-4b93-bc63-1b1aa8a8aa42
                changedKeyInput:
                  value:
                    error:
                      code: IDEMPOTENCY_KEY_REUSED
                      message: Idempotency key was used with different checkout inputs.
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Retrieve immutable purchase details
      description: Product names, prices, quantities, and totals come from order snapshots, never current product data.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful order with items sorted by product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: ORDER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/coupons:
    post:
      tags: [Administration]
      operationId: generateCoupon
      summary: Generate a coupon for the oldest eligible unrewarded milestone
      description: >-
        Administrative operation without authentication. Every n globally successful orders
        unlocks a milestone; discounted orders count. Generation is explicit, not automatic.
        One request creates one coupon, even when several milestones are eligible. Coupons
        have no expiry and can be used by anyone possessing the code. Requests are not
        idempotent across different milestones: a retry may generate the next eligible coupon.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        '201':
          description: Coupon created for one previously unrewarded milestone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: NO_ELIGIBLE_MILESTONE; no successful-order milestone remains unrewarded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Administration]
      operationId: listCoupons
      summary: List generated coupons and redemption associations
      description: Read-only; sorted by milestone number. Administrative, without authentication.
      responses:
        '200':
          description: All generated coupons, including unused codes and redeemed order IDs.
          content:
            application/json:
              schema:
                type: object
                required: [coupons]
                properties:
                  coupons:
                    type: array
                    items:
                      $ref: '#/components/schemas/Coupon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/reports/summary:
    get:
      tags: [Administration]
      operationId: getSummaryReport
      summary: Read an all-time reconciled sales and rewards summary
      description: >-
        Administrative, without authentication. Reads one repeatable-read snapshot; never
        generates coupons or mutates counters. Quantities include zero-sale products and
        are sorted by product ID. Gross minus discounts equals net. Generated equals
        available plus redeemed. Failed requests and checkout replays do not add sales.
      responses:
        '200':
          description: Summary from committed orders and coupons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Summary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    CartId:
      name: cartId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: coffee
  schemas:
    Money:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: Integer USD minor units (100 equals one dollar).
      example: 1299
    Product:
      type: object
      required: [id, name, unitPriceMinor, inventory, currency]
      properties:
        id:
          type: string
          example: coffee
        name:
          type: string
          example: Coffee beans
        unitPriceMinor:
          $ref: '#/components/schemas/Money'
        inventory:
          type: integer
          minimum: 0
          example: 20
        currency:
          type: string
          enum: [USD]
    CartItem:
      type: object
      required:
        [
          productId,
          name,
          quantity,
          unitPriceMinor,
          lineTotalMinor,
          availableInventory,
          isAvailable,
        ]
      properties:
        productId:
          type: string
          example: coffee
        name:
          type: string
          example: Coffee beans
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
          example: 2
        unitPriceMinor:
          $ref: '#/components/schemas/Money'
        lineTotalMinor:
          $ref: '#/components/schemas/Money'
        availableInventory:
          type: integer
          minimum: 0
        isAvailable:
          type: boolean
    Cart:
      type: object
      required: [id, status, createdAt, currency, items, grossMinor]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, CHECKED_OUT]
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
          enum: [USD]
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        grossMinor:
          $ref: '#/components/schemas/Money'
      example:
        id: 7f9aad66-343a-4b93-bc63-1b1aa8a8aa42
        status: OPEN
        createdAt: '2026-09-10T12:00:00.000Z'
        currency: USD
        items:
          - productId: coffee
            name: Coffee beans
            quantity: 2
            unitPriceMinor: 1299
            lineTotalMinor: 2598
            availableInventory: 20
            isAvailable: true
        grossMinor: 2598
    Order:
      type: object
      required:
        [
          id,
          cartId,
          coupon,
          createdAt,
          currency,
          discountBps,
          grossMinor,
          discountMinor,
          netMinor,
          items,
        ]
      properties:
        id:
          type: string
          format: uuid
        cartId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
          enum: [USD]
        coupon:
          type: object
          nullable: true
          required: [id, code]
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
        discountBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Discount rate snapshot; zero when no coupon was used.
        grossMinor:
          $ref: '#/components/schemas/Money'
        discountMinor:
          $ref: '#/components/schemas/Money'
        netMinor:
          $ref: '#/components/schemas/Money'
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              [productId, name, quantity, unitPriceMinor, lineTotalMinor]
            properties:
              productId:
                type: string
              name:
                type: string
              quantity:
                type: integer
                minimum: 1
                maximum: 1000000
              unitPriceMinor:
                $ref: '#/components/schemas/Money'
              lineTotalMinor:
                $ref: '#/components/schemas/Money'
      example:
        id: a460eae5-631c-4a28-922d-b21af7a046a3
        cartId: 7f9aad66-343a-4b93-bc63-1b1aa8a8aa42
        createdAt: '2026-09-10T12:00:00.000Z'
        currency: USD
        coupon: null
        discountBps: 0
        grossMinor: 2598
        discountMinor: 0
        netMinor: 2598
        items:
          - productId: coffee
            name: Coffee beans
            quantity: 2
            unitPriceMinor: 1299
            lineTotalMinor: 2598
    Coupon:
      type: object
      required:
        [
          id,
          code,
          milestoneNumber,
          discountBps,
          createdAt,
          status,
          redeemedOrderId,
        ]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          description: Case-sensitive bearer code.
        milestoneNumber:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Milestone k unlocks after k times n successful orders.
        discountBps:
          type: integer
          minimum: 0
          maximum: 10000
          example: 1000
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [AVAILABLE, REDEEMED]
        redeemedOrderId:
          type: string
          format: uuid
          nullable: true
    Summary:
      type: object
      required:
        [
          currency,
          purchasedByProduct,
          grossRevenueMinor,
          totalDiscountsMinor,
          netRevenueMinor,
          coupons,
          successfulOrders,
        ]
      properties:
        currency:
          type: string
          enum: [USD]
        purchasedByProduct:
          type: array
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId:
                type: string
              quantity:
                type: integer
                minimum: 0
                maximum: 9007199254740991
        grossRevenueMinor:
          $ref: '#/components/schemas/Money'
        totalDiscountsMinor:
          $ref: '#/components/schemas/Money'
        netRevenueMinor:
          $ref: '#/components/schemas/Money'
        coupons:
          type: object
          required: [generated, available, redeemed]
          properties:
            generated:
              type: integer
              minimum: 0
            available:
              type: integer
              minimum: 0
            redeemed:
              type: integer
              minimum: 0
        successfulOrders:
          type: integer
          minimum: 0
      example:
        currency: USD
        purchasedByProduct:
          - productId: coffee
            quantity: 2
          - productId: limited-print
            quantity: 0
          - productId: mug
            quantity: 2
          - productId: notebook
            quantity: 3
          - productId: tea
            quantity: 1
        grossRevenueMinor: 6848
        totalDiscountsMinor: 150
        netRevenueMinor: 6698
        coupons:
          generated: 2
          available: 1
          redeemed: 1
        successfulOrders: 4
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
  responses:
    Cart:
      description: Cart with current estimated prices and totals, items sorted by product ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Cart'
    BadRequest:
      description: VALIDATION_ERROR, INVALID_JSON, or AMOUNT_OUT_OF_RANGE (an amount exceeds safe JSON integer bounds).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: CART_NOT_FOUND, or PRODUCT_NOT_FOUND when setting an item.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: CART_ALREADY_CHECKED_OUT, or INSUFFICIENT_INVENTORY when setting an item.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INSUFFICIENT_INVENTORY
              message: Requested quantity exceeds available inventory.
              details:
                productId: coffee
                requested: 21
                available: 20
    TooLarge:
      description: PAYLOAD_TOO_LARGE (request body exceeds 32 KB).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Busy:
      description: SERVICE_BUSY after lock timeout, deadlock, or serialization conflict; retry the request.
      headers:
        Retry-After:
          schema:
            type: integer
          example: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error, with no database details exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
